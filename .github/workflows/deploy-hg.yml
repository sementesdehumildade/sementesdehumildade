name: Deploy para HostGator

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Build de produção
        run: npm run build

      - name: Deploy via FTP para HostGator
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ftp.sementesdehumildade.com.br
          username: gitHub@sementesdehumildade.com.br
          password: ${{ secrets.HG_FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./dist/
          server-dir: /
          dry-run: false
          log-level: verbose
          exclude: ""
          dangerous-clean-slate: true
